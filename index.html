<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Tunk233 应用 —— 个人开发者应用与政策文档入口" />
  <title>Tunk233 应用</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #5c6570;
      --accent: #2f6fed;
      --line: #e6e9ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 220px);
      line-height: 1.7;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      letter-spacing: 0.02em;
    }
    header .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.02rem;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 600;
    }
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .app-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      border-color: #c9d7f5;
      box-shadow: 0 4px 16px rgba(47, 111, 237, 0.08);
    }
    .app-card h3 {
      margin: 0 0 4px;
      font-size: 1.15rem;
    }
    .app-card .en {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .app-card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .app-links {
      font-size: 0.9rem;
    }
    .app-links a {
      color: var(--accent);
      text-decoration: none;
      margin-right: 14px;
    }
    .app-links a:hover { text-decoration: underline; }
    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tunk233 应用</h1>
      <p class="lead">个人开发者应用与政策文档入口</p>
    </header>

    <h2>应用列表</h2>
    <div class="app-list">
      <article class="app-card">
        <a href="./apps/filehide/index.html" style="text-decoration:none;color:inherit;display:block;">
          <h3>文件隐藏</h3>
          <div class="en">FileHide</div>
          <p>安卓本地文件隐藏工具。选择文件夹后一键隐藏照片、视频与文档，支持桌面伪装与应急退出。文件处理均在本机完成。</p>
        </a>
        <div class="app-links">
          <a href="./apps/filehide/index.html">介绍</a>
          <a href="./apps/filehide/privacy.html">隐私政策</a>
          <a href="./apps/filehide/terms.html">用户协议</a>
        </div>
      </article>
    </div>

    <footer>
      <p>个人开发者 · 联系邮箱：<a href="mailto:wonsupport@126.com">wonsupport@126.com</a></p>
    </footer>
  </div>
</body>
</html>
